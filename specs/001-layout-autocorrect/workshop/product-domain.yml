depth_reason: >-
  First feature of a new product (rules out Light); single-maintainer OSS utility,
  not regulated/multi-team/commercial (rules out Deep). Crew-proposed; human was
  offered Light/Deep adjustment repeatedly and answered all Standard-depth areas

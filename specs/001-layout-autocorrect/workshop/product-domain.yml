schema_version: "1.0"
depth: "standard"
depth_reason: >-
  First feature of a new product (rules out Light); single-maintainer OSS utility, not regulated,
  multi-team or commercial (rules out Deep). Crew-proposed; the human was offered Light/Deep
  adjustment repeatedly and answered all eight Standard-depth areas without adjusting.
context_scope: "feature_standalone"
product_id: "keycontextai"
product_context_ref: null
areas:
  users_stakeholders: "Open-source tool for any language-pair combination, not restricted to the Hebrew community. Hebrew<->English is the first shipped, proven pair. The maintainer is the first user; community users including non-developers matter, so installer and docs polish count. IME/composition languages may be deferred."
  pain_workaround: "Wrong-layout bursts noticed late; manual delete-switch-retype is the only workaround today. Cost of doing nothing is constant micro-friction dozens of times a day. The bar to beat is the manual fix, without ever making things worse."
  existing_context: "New standalone product; integrates only with the Windows input stack and layout APIs plus the user's chosen LLM provider."
  constraints: "Windows-only; .NET/C# ecosystem externally fixed; BYOK economics with the project never bearing inference costs; privacy hard rule (keystrokes in-memory only, one context sentence may reach a cloud LLM and is never retained, the dictionary is persistable and syncable across the user's own machines); MIT license; solo developer plus AI agents; antivirus/SmartScreen tolerance binding with a zero-budget signing qualifier."
  outcomes_metrics: "False corrections are worse than missed ones, so the tool is conservative. Distinct sounds separate detection-only from seamless correction and dictionary from AI tier. Race-safe correction remaps keystrokes typed during the correction window (mapping may apply twice; input after the layout switch is remapped). Dictionary tier feels instantaneous (<10ms lookup) and the LLM tier is useful under 500ms. Personal bar: the maintainer stops noticing layout mistakes. Community bar: real adoption that survives antivirus."
  mvp_nongoals_vision: "MVP is the language-pair-agnostic dictionary tier (He<->En first), seamless race-safe correction, detection-only mode, tray app with per-app exclusions, password-field suspension, in-memory-only rule, AND the LLM tier built on the Microsoft Agent Framework, which is the product edge and the Foundry positioning. Deferred: IME languages, Windows Service, dictionary cloud sync, installed-assistant discovery, further dictionary packs. v1 fails if it mangles correct text or if antivirus/SmartScreen blocks ordinary users."
  alternatives_differentiation: "Competition matters only as a learning source (capabilities, gaps, adoption-failure causes), never as rivalry. Differentiators: MAF/Foundry context-aware AI tier, any language pair by design, trust by construction (OSS, memory-only, BYOK). Winning dimension is accuracy and trust."
  adoption_rollout: "Dogfood, then public GitHub release, then possibly winget or the Microsoft Store. Risks: antivirus trust, AI-tier key friction mitigated by installed-assistant discovery, and keystroke-tool skepticism mitigated by OSS transparency plus the memory-only rule. Dictionary tier is zero-config out of the box; the AI tier is opt-in. No migration or training; docs are the README plus a short setup guide; support via GitHub issues."

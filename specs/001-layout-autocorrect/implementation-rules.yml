      compatibility: ".NET 10"
      cost: "none"
      coupling: "confined to the LLM accessor's resilience pipeline"
      replaceability: "medium"
      test_impact: "timeout and circuit-breaker behavior covered by tests"
    - name: "Microsoft.Extensions.DependencyInjection + Hosting"
      version: "10.x"
      license: "MIT"
      source_org: "Microsoft"
      url: "https://learn.microsoft.com/dotnet/core/extensions/dependency-injection"
      maintenance: "platform component"
      security_status: "no known advisories at selection time"
      compatibility: ".NET 10"
      cost: "none"
      coupling: "composition root only"
      replaceability: "low need"
      test_impact: "enables interface-based mocking across managers"
    - name: "WPF (Windows Desktop workload)"
      version: ".NET 10 Windows Desktop"
      license: "MIT"
      source_org: "Microsoft"
      url: "https://learn.microsoft.com/dotnet/desktop/wpf/"
      maintenance: "platform component"
      security_status: "no known advisories at selection time"
      compatibility: "Windows 10/11, x64 and arm64"
      cost: "none"
      coupling: "clients only (TrayClient, OverlayClient)"
      replaceability: "medium - WinUI 3 considered and deferred as heavier for a tray-plus-overlay shape"
      test_impact: "UI verified by manual smoke, not unit tests"

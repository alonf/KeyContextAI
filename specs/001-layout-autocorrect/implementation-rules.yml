      security_status: "no known advisories at selection time"
      compatibility: ".NET 10; requires an authenticated Copilot CLI on the user machine"
      cost: "none to the project; uses the user's own Copilot subscription"
      coupling: "isolated behind ILlmAccessor"
      replaceability: "high"
      test_impact: "integration test gated on CLI presence"
